<app-page-header title="Members">
  <button class="icon-btn" type="button" (click)="toggleSearch()" aria-label="Search"><app-icon [name]="searching() ? 'close' : 'search'" [size]="20" /></button>
  <button class="icon-btn" type="button" [class.icon-btn--primary]="filtering()" (click)="filtering.set(!filtering())" aria-label="Filter"><app-icon name="filter" [size]="20" /></button>
  <a class="icon-btn icon-btn--primary" routerLink="/members/add" aria-label="Add member"><app-icon name="plus" [size]="22" /></a>
</app-page-header>

@if (searching()) {
<div class="members-reveal">
  <div class="input-group"><app-icon name="search" [size]="18" /><input placeholder="Search by name, phone or member no…" [ngModel]="query()" (ngModelChange)="query.set($event)" /></div>
</div>
}
@if (filtering()) {
<div class="members-reveal">
  <div class="chips members-filter">
    @for (f of filters; track f.id) {
      <button class="chip" type="button" [class.chip--active]="status() === f.id" (click)="status.set(f.id)">{{ f.label }}</button>
    }
  </div>
  <select class="input members-group" [ngModel]="groupFilter()" (ngModelChange)="groupFilter.set($event === 'All' ? 'All' : +$event)">
    <option value="All">All groups</option>
    @for (g of store.groups(); track g.id) { <option [value]="g.id">{{ g.name }}</option> }
  </select>
</div>
}

<app-tabs [options]="tabs()" [(value)]="tab" />

<div class="members-summary">
  <span><i class="dot dot--ok"></i>{{ paidCount() }} paid</span>
  <span><i class="dot dot--pd"></i>{{ pendingCount() }} with dues</span>
</div>

@for (m of visible().slice(0, limit()); track m.id; let i = $index) {
  <app-member-item class="reveal" [style.--i]="i" [member]="m" />
} @empty {
  <app-empty-state icon="user" title="No members found" [text]="store.members().length ? 'Adjust your search or filters.' : 'Add your first member to get started.'" />
}
@if (visible().length > limit()) { <button class="btn btn--soft" type="button" (click)="more()">Show more ({{ visible().length - limit() }} left)</button> }
