<app-page-header title="Notifications" [subtitle]="unread() ? unread() + ' unread' : 'You are all caught up'">
  <button class="icon-btn" type="button" [disabled]="!unread()" (click)="store.markAllNotificationsRead()" aria-label="Mark all as read"><app-icon name="check" [size]="22" [stroke]="2.6" /></button>
</app-page-header>

<app-tabs [options]="tabs()" [(value)]="tab" />

@for (n of visible(); track n.id; let i = $index) {
  <div class="card card--static row-gap notif reveal" [class.notif--unread]="!n.read" [style.--i]="i" (click)="store.markNotificationRead(n.id)" (keydown.enter)="store.markNotificationRead(n.id)" tabindex="0" role="button">
    <app-icon-tile [icon]="tone(n).icon" [bg]="tone(n).bg" [color]="tone(n).color" [size]="40" />
    <div class="notif__text">
      <b>{{ n.title }}</b>
      <span class="notif__body">{{ n.message }}</span>
      <span class="muted">{{ n.time | stamp }}</span>
    </div>
    @if (!n.read) { <i class="notif__dot"></i> }
  </div>
} @empty {
  <app-empty-state icon="bell" title="Nothing new" text="We will let you know when something important happens." />
}
