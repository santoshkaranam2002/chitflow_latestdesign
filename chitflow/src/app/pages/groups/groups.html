<app-page-header title="Chit Groups" subtitle="Manage and track every group">
  <button class="icon-btn" type="button" (click)="toggleSearch()" aria-label="Search"><app-icon [name]="searching() ? 'close' : 'search'" [size]="20" /></button>
  <a class="icon-btn icon-btn--primary" routerLink="/groups/create" aria-label="Create group"><app-icon name="plus" [size]="22" /></a>
</app-page-header>

<div class="groups-search" [class.groups-search--open]="searching()">
  <div class="input-group"><app-icon name="search" [size]="18" /><input placeholder="Search groups…" [(ngModel)]="query" /></div>
</div>

<section class="summary">
  <div class="summary__head">
    <span class="summary__icon"><app-icon name="wallet" [size]="22" /></span>
    <div>
      <span class="summary__label">Total chit value</span>
      <b class="summary__value">₹<span [appCountUp]="totalValue()"></span></b>
    </div>
  </div>
  <div class="summary__tiles">
    <div class="summary__tile summary__tile--orange"><app-icon name="grid" [size]="16" /><b>{{ visible().length }}</b><span>Groups</span></div>
    <div class="summary__tile summary__tile--purple"><app-icon name="users" [size]="16" /><b>{{ totalMembers() }}</b><span>Members</span></div>
    <div class="summary__tile summary__tile--green"><app-icon name="trend" [size]="16" /><b>{{ avgProgress() }}%</b><span>Avg. progress</span></div>
  </div>
</section>

<app-tabs [options]="tabs()" [(value)]="tab" />

<div class="chips groups-sort">
  @for (s of sorts; track s.id) {
    <button class="chip" type="button" [class.chip--active]="sort() === s.id" (click)="sort.set(s.id)">{{ s.label }}</button>
  }
</div>

<div class="groups-list">
  @for (g of visible(); track g.id; let i = $index) {
    <app-group-card class="reveal" [style.--i]="i" [group]="g" />
  } @empty {
    <app-empty-state icon="users" title="No groups found" [text]="query() || tab() !== 'all' ? 'Try a different search or filter.' : 'Create your first chit group to get started.'" />
  }
</div>
